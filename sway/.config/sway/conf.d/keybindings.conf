### Lancement d'applications
bindsym Mod4+Return exec sh -c 'wezterm & sleep 0.5 && swaymsg [title="WezTerm"] resize 800 600'
bindsym Mod4+Shift+m exec wmenu-run
bindsym Mod4+Shift+n exec firefox
bindsym Mod4+Shift+f kill
bindsym Mod4+r reload
bindsym Mod4+q exec swaynag -t warning -m 'Quitter Sway ?' -b 'Oui' 'swaymsg exit'

### Déplacer le focus
bindsym Mod4+$left focus left
bindsym Mod4+$down focus down
bindsym Mod4+$up focus up
bindsym Mod4+$right focus right

### Déplacer la fenêtre active
bindsym Mod4+Shift+$left move left
bindsym Mod4+Shift+$down move down
bindsym Mod4+Shift+$up move up
bindsym Mod4+Shift+$right move right

### Changer d'espace de travail (pavé numérique)
bindsym Mod4+KP_1 workspace number 1
bindsym Mod4+KP_2 workspace number 2
bindsym Mod4+KP_3 workspace number 3
bindsym Mod4+KP_4 workspace number 4

### Déplacer le conteneur actif vers un espace (pavé numérique)
bindsym Mod4+Shift+KP_1 move container to workspace number 1
bindsym Mod4+Shift+KP_2 move container to workspace number 2
bindsym Mod4+Shift+KP_3 move container to workspace number 3
bindsym Mod4+Shift+KP_4 move container to workspace number 4
