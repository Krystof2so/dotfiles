# Rendu
vsync = true
backend = "glx"
unredir-if-possible = false

# Ombres
shadow = true
shadow-radius = 12
shadow-offset-x = -6
shadow-offset-y = -6
shadow-opacity = 0.35
shadow-color = "#000000"
shadow-exclude = [
  "_GTK_FRAME_EXTENTS@:c",     # pas d'ombre sur les décorations GTK
  "class_g = 'tint2'",          # pas d'ombre sur le panneau
  "window_type = 'dock'"
]

# Fondus 
fading = true
fade-in-step = 0.07
fade-out-step = 0.07
fade-delta = 6

# Coins arrondis 
corner-radius = 8
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'tint2'"
]

# Transparence 
inactive-opacity = 0.90
active-opacity = 1.0
opacity-rule = [
  "95:class_g = 'URxvt' || class_g = 'XTerm'",   
  "0:_NET_WM_STATE@:32a *= 'HIDDEN'"
]
